<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PD Warriors 2027 — Biometric Verification</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fffaf0;color:#10231b;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(100% - 24px,760px);margin:0 auto;padding:18px 0 32px}
.hero{background:#0c5b3a;color:#fff;border-radius:24px;padding:32px 18px;text-align:center;box-shadow:0 10px 28px rgba(25,45,35,.12)}
.hero h1{margin:0;font-size:38px;line-height:1.05;font-weight:900}
.hero p{margin:10px 0 0;font-size:21px;font-weight:700}
.back{display:flex;align-items:center;min-height:54px;color:#0c5b3a;text-decoration:none;font-size:20px;font-weight:900}
.card{background:#fff;border:1px solid #e7dfd1;border-radius:24px;padding:28px 22px;box-shadow:0 10px 28px rgba(25,45,35,.10)}
.card h2{margin:0 0 20px;color:#0c5b3a;font-size:32px;line-height:1.1;font-weight:900}
.who{background:#fff4e5;border:1px solid #edc98f;border-radius:17px;padding:18px 16px;font-size:21px;line-height:1.35;font-weight:900}
button{display:block;width:100%;border-radius:17px;min-height:78px;padding:16px;margin-top:14px;font-family:inherit;font-size:21px;line-height:1.2;font-weight:900;cursor:pointer}
.primary{border:0;background:#285d91;color:#fff}
.secondary{border:2px solid #ddd0b7;background:#f8f4e9;color:#0c5b3a}
.privacy{margin:20px 2px 0;color:#65716b;font-size:18px;line-height:1.55;font-weight:600}
.footer{text-align:center;color:#65716b;font-size:17px;font-weight:700;padding:22px 8px}
@media (min-width:500px){
 .wrap{width:min(100% - 40px,900px)}
 .hero h1{font-size:44px}.hero p{font-size:23px}
 .card{padding:34px 28px}.card h2{font-size:36px}
 .who{font-size:23px}button{font-size:23px;min-height:82px}
 .privacy{font-size:19px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>PD Warriors 2027</h1>
    <p>Biometric Verification</p>
  </header>
  <a class="back" href="./index.html?v=59">← Back to Search</a>
  <section class="card">
    <h2>Verify on Your Own Phone</h2>
    <div class="who" id="who">Loading participant…</div>
    <button class="primary" id="bio">VERIFY &amp; GENERATE QR CODE</button>
    <button class="secondary" id="fallback">STAFF-ASSISTED VERIFICATION &amp; GENERATE QR</button>
    <p class="privacy">Your fingerprint or face stays on your own device. The event system does not store fingerprint images, face images, or biometric templates.</p>
  </section>
  <div class="footer">Step 2 of 3 • Verify &amp; Generate QR Code</div>
</main>
<script src="./app-core.js?v=59"></script>
<script>
const p=PDW.active();
if(!p){location.replace('./index.html?v=59')}
else document.getElementById('who').textContent=p.name+' — '+(p.type==='PATIENT'?'PD Warrior':'Companion');

document.getElementById('bio').onclick=async()=>{
 const p=PDW.active();
 try{
  if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('unsupported');
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const userId=crypto.getRandomValues(new Uint8Array(16));
  await navigator.credentials.create({publicKey:{
   challenge,
   rp:{name:'PD Warriors 2027'},
   user:{id:userId,name:p.id,displayName:p.name},
   pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
   authenticatorSelection:{userVerification:'required'},
   timeout:60000,attestation:'none'
  }});
  PDW.updatePerson(p.id,x=>{x.biometric=true;x.verifyMethod='DEVICE_BIOMETRIC';x.biometricVerifiedAt=new Date().toISOString()});
  location.href='./pass.html?v=59';
 }catch(e){alert('Biometric was unavailable or cancelled. Please try again or use staff-assisted verification.')}
};
document.getElementById('fallback').onclick=()=>{
 const p=PDW.active();
 PDW.updatePerson(p.id,x=>{x.biometric=false;x.verifyMethod='STAFF_ASSISTED';x.biometricVerifiedAt=null});
 location.href='./pass.html?v=59';
};
</script>
</body>
</html>
