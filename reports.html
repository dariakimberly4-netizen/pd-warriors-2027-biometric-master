<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./app.css"><title>PD Warriors 2027 — Reports</title></head><body><div class="app"><div class="hero"><h1>Reports</h1><p>Final Event Summary</p></div><a class="toplink" href="./admin.html">← Admin Menu</a><div class="card"><div class="kpi"><div><b id="arr">0</b>Arrivals</div><div><b id="snack">0</b>Snack</div><div><b id="lunch">0</b>Lunch</div><div><b id="raffle">0</b>Raffle</div></div><button class="primary" id="sync">FINAL SYNC</button><button class="gold" id="download">DOWNLOAD REPORT</button></div></div><script src="./app-core.js"></script><script>function r(){const d=PDW.db();document.querySelector('#arr').textContent=d.people.filter(x=>x.arrived).length;document.querySelector('#snack').textContent=d.people.filter(x=>x.snack).length;document.querySelector('#lunch').textContent=d.people.filter(x=>x.lunch).length;document.querySelector('#raffle').textContent=d.people.filter(x=>x.raffle).length}r();document.querySelector('#sync').onclick=()=>{const d=PDW.db();d.pending=0;d.syncedAt=new Date().toLocaleTimeString();PDW.save(d);alert('Final sync complete')};document.querySelector('#download').onclick=()=>{const d=PDW.db(),rows=[['ID','Name','Type','Biometric','Arrived','Snack','Lunch','Raffle'],...d.people.map(p=>[p.id,p.name,p.type,p.biometric?'YES':'NO',p.arrived?'YES':'NO',p.snack?'YES':'NO',p.lunch?'YES':'NO',p.type==='COMPANION'?'NOT ELIGIBLE':p.raffle?'YES':'NO'])],csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PDW2027-final-report.csv';a.click()};</script></body></html>
