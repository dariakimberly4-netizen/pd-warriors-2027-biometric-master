<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="./manifest.webmanifest?v=65">
<title>PD Warriors 2027 — Generated QR Code</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fffaf0;color:#17221c;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
.page{width:100%;min-height:100vh;padding:14px 12px 30px}
.hero{width:100%;background:#0f5132;color:#fff;border-radius:24px;padding:34px 18px;text-align:center;box-shadow:0 10px 26px rgba(20,35,28,.10)}
.hero h1{margin:0;font-size:clamp(38px,9.5vw,50px);line-height:1.04;font-weight:900}
.hero p{margin:10px 0 0;font-size:clamp(22px,5.7vw,28px);font-weight:700}
.back{display:flex;align-items:center;min-height:56px;padding:0 4px;color:#0f5132;text-decoration:none;font-size:clamp(19px,5vw,24px);font-weight:900}
.outer{width:100%;background:#fff;border:1px solid #e7dfcf;border-radius:24px;padding:18px 12px 24px;box-shadow:0 10px 26px rgba(20,35,28,.08)}
.pass{width:100%;max-width:520px;margin:0 auto;background:#fff;border:2px solid #c6a15b;border-radius:26px;padding:28px 20px;text-align:center}
.org{font-size:clamp(16px,4.2vw,20px);font-weight:900;color:#0f5132;line-height:1.3}
.event{margin:5px 0 14px;color:#0f5132;font-size:clamp(24px,6.5vw,32px);line-height:1.1;font-weight:900}
.name{font-size:clamp(30px,8vw,40px);line-height:1.08;font-weight:900;color:#111}
.type{margin-top:6px;font-size:clamp(18px,4.8vw,22px);color:#555;font-weight:700}
#qr{width:320px;min-height:320px;margin:24px auto 18px;padding:8px;background:#fff;display:flex;align-items:center;justify-content:center}
#qr img,#qr canvas{width:304px!important;height:304px!important;max-width:100%!important}
.pid{font-size:clamp(26px,7vw,34px);font-weight:900;letter-spacing:.01em}
.badge{display:inline-block;margin-top:14px;padding:11px 16px;border-radius:999px;background:#e9f6ee;color:#0f5132;font-size:clamp(16px,4.3vw,20px);font-weight:900}
.entitlement{margin:20px 0 0;text-align:center;color:#5d665f;font-size:clamp(18px,4.8vw,22px);line-height:1.5;font-weight:700}
.footer{text-align:center;color:#707873;font-size:clamp(17px,4.4vw,20px);font-weight:700;padding:24px 8px 10px}
@media(max-width:390px){
  .page{padding:10px 8px 24px}
  .pass{padding:24px 14px}
  #qr{width:292px;min-height:292px}
  #qr img,#qr canvas{width:276px!important;height:276px!important}
}
@media(min-width:720px){
  .page{max-width:900px;margin:auto;padding:28px}
  .pass{max-width:560px}
}
</style>
</head>
<body>
<main class="page">
<header class="hero">
  <h1>PD Warriors 2027</h1>
  <p>Generated QR Code</p>
</header>

<a class="back" id="backLink" href="./index.html?v=65">← Back to Search</a>

<section class="outer">
  <div class="pass">
    <div class="org">PARKINSON'S DISEASE WARRIORS PHILIPPINES</div>
    <div class="event">GET TOGETHER 2027</div>
    <div class="name" id="name">—</div>
    <div class="type" id="type">—</div>

    <div id="qr"></div>

    <div class="pid" id="id">—</div>
    <div class="badge" id="verify">QR Code Ready ✓</div>

    <div class="entitlement" id="entitlementText">Show this QR code to event staff.</div>
  </div>
</section>

<div class="footer">Generated QR Code</div>
</main>

<script src="./app-core.js?v=65"></script>
<script src="./vendor/qrcode.min.js?v=65"></script>
<script>
const p=PDW.active();
const staffMode=new URLSearchParams(location.search).get('staff')==='1';
const backLink=document.getElementById('backLink');

if(staffMode){
  backLink.href='./master.html?v=65';
  backLink.textContent='← Back to Registration';
}else{
  backLink.href='./index.html?v=65';
  backLink.textContent='← Back to Search';
}

if(!p){
  location.replace('./index.html?v=65');
}else{
  document.getElementById('name').textContent=p.name;
  document.getElementById('type').textContent=p.type==='PATIENT'?'PD WARRIOR':'COMPANION';
  document.getElementById('id').textContent=p.id;

  document.getElementById('entitlementText').textContent=
    p.type==='COMPANION'
      ? 'Companion QR Code • Snack ✓ • Lunch ✓ • Raffle ✕'
      : 'PD Warrior QR Code • Snack ✓ • Lunch ✓ • Raffle ✓';

  const badge=document.getElementById('verify');
  if(p.biometric){
    badge.textContent='Biometric Verified ✓';
  }else if(p.verifyMethod==='STAFF_ASSISTED'){
    badge.textContent='Staff-Assisted Verification ✓';
  }else{
    badge.textContent='QR Code Ready ✓';
  }

  const q=document.getElementById('qr');
  const value=PDW.eventPassPayload(p);

  if(window.QRCode){
    new QRCode(q,{
      text:value,
      width:304,
      height:304,
      colorDark:'#000000',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });
  }else{
    q.textContent='QR generator unavailable. Please reload the app.';
  }
}
</script>
</body>
</html>
