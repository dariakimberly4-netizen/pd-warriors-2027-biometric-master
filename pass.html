<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./app.css?v=64">
<title>PD Warriors 2027 — Generated QR Code</title>
<style>
@media(max-width:700px){
  .app{width:calc(100% - 20px);max-width:none;padding:16px 0 30px}
  .hero{padding:30px 16px;border-radius:22px}
  .hero h1{font-size:36px}
  .hero p{font-size:21px;margin-top:8px}
  .toplink{font-size:19px;min-height:48px;display:flex;align-items:center}
  .card{padding:22px 14px;border-radius:22px}
  .pass{width:100%;max-width:390px;padding:24px 16px;border-radius:22px}
  .pass .small{font-size:15px!important;line-height:1.35}
  .pass h3{font-size:24px;margin:6px 0 10px}
  .pass .name{font-size:30px;line-height:1.1}
  #type{font-size:18px;margin-top:5px}
  #qr{width:280px!important;min-height:280px!important;margin:22px auto!important;padding:8px!important}
  #qr img,#qr canvas{width:264px!important;height:264px!important}
  .pid{font-size:25px}
  .badge{font-size:16px;padding:11px 14px;margin-top:12px}
  #entitlementText{font-size:18px;line-height:1.5}
  .footer{font-size:17px;padding-top:18px}
}
@media(max-width:370px){
  #qr{width:250px!important;min-height:250px!important}
  #qr img,#qr canvas{width:234px!important;height:234px!important}
  .pass .name{font-size:27px}
}
</style></head>
<body>
<div class="app">
  <div class="hero">
    <h1>PD Warriors 2027</h1>
    <p>Generated QR Code</p>
  </div>

  <a class="toplink" id="backLink" href="./index.html?v=64">← Back</a>

  <div class="card">
    <div class="pass">
      <div class="small" style="font-weight:900;color:#0f5132">PARKINSON'S DISEASE WARRIORS PHILIPPINES</div>
      <h3>GET TOGETHER 2027</h3>
      <div class="name" id="name">—</div>
      <div id="type">—</div>

      <div id="qr" style="width:230px;min-height:230px;margin:20px auto;padding:8px;background:#fff;display:flex;align-items:center;justify-content:center"></div>

      <div class="pid" id="id">—</div>
      <div class="badge" id="verify">QR Code Ready ✓</div>
    </div>

    <p class="small" style="text-align:center;font-size:16px;line-height:1.5">
      <span id="entitlementText">Show this QR code to event staff.</span>
    </p>

    <button class="primary" id="bioBtn" style="display:none">ACTIVATE DEVICE BIOMETRIC</button>
  </div>

  <div class="footer">Generated QR Code</div>
</div>

<script src="./app-core.js?v=64"></script>
<script src="./vendor/qrcode.min.js?v=64"></script>
<script>
const p=PDW.active();
const staffMode=new URLSearchParams(location.search).get('staff')==='1';
const backLink=document.querySelector('#backLink');
if(staffMode){
  backLink.href='./master.html?v=64';
  backLink.textContent='← Back to Registration';
}else{
  backLink.href='./index.html?v=64';
  backLink.textContent='← Back to Search';
}

if(!p){
  location.href='./index.html?v=64';
}else{
  document.querySelector('#name').textContent=p.name;
  document.querySelector('#type').textContent=p.type==='PATIENT'?'PD WARRIOR':'COMPANION';
  document.querySelector('#id').textContent=p.id;
  document.querySelector('#entitlementText').textContent=p.type==='COMPANION'
    ? 'Companion QR Code • Snack ✓ • Lunch ✓ • Raffle ✕'
    : 'PD Warrior QR Code • Snack ✓ • Lunch ✓ • Raffle ✓';

  const badge=document.querySelector('#verify');
  const bioBtn=document.querySelector('#bioBtn');

  if(p.biometric){
    badge.textContent='Biometric Verified ✓';
  }else if(p.verifyMethod==='STAFF_ASSISTED'){
    badge.textContent='Staff-Assisted Verification ✓';
  }else{
    badge.textContent='Digital Event Pass Ready ✓';
    bioBtn.style.display='flex';
  }

  const q=document.querySelector('#qr');
  const value=PDW.eventPassPayload(p);

  if(window.QRCode){
    new QRCode(q,{
      text:value,
      width:264,
      height:264,
      colorDark:'#000000',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });
  }else{
    q.textContent='QR generator unavailable. Please reconnect and reload.';
  }

  bioBtn.onclick=()=>{
    location.href='./biometric-app-v63.html?v=64';
  };
}
</script>
</body>
</html>
