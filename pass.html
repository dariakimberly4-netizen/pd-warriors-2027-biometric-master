<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./app.css"><title>PD Warriors 2027 — Event Pass</title></head><body><div class="app"><div class="hero"><h1>PD Warriors 2027</h1><p>Digital Event Pass</p></div><a class="toplink" href="./biometric.html?v=14">← Back to Biometric</a><div class="card"><div class="pass"><div class="small" style="font-weight:900;color:#0f5132">PARKINSON'S DISEASE WARRIORS PHILIPPINES</div><h3>GET TOGETHER 2027</h3><div class="name" id="name">—</div><div id="type">—</div><div id="qr" style="width:210px;height:210px;margin:18px auto;padding:8px;background:#fff"></div><div class="pid" id="id">—</div><div class="badge" id="verify">—</div></div><p class="small" style="text-align:center">Keep this pass available on your phone. Event staff will scan it at the appropriate station.</p></div><div class="footer">Step 3 of 3 • Event pass only</div></div><script src="./app-core.js?v=14"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const p=PDW.active();if(!p){location.href='./demo.html?v=14'}else{document.querySelector('#name').textContent=p.name;document.querySelector('#type').textContent=p.type==='PATIENT'?'PD WARRIOR':'COMPANION';document.querySelector('#id').textContent=p.id;document.querySelector('#verify').textContent=p.biometric?'Biometric verified ✓':'Staff-assisted verification';const q=document.querySelector('#qr');const value=PDW.eventPassPayload(p);if(window.QRCode){new QRCode(q,{text:value,width:194,height:194,correctLevel:QRCode.CorrectLevel.M})}else{q.textContent='QR unavailable'}}</script></body></html>
