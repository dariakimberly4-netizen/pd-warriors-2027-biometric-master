<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./app.css?v=40"><title>PD Warriors 2027 — Staff</title></head>
<body><div class="app">
<div class="hero"><h1>PD Warriors 2027</h1><p>Staff Menu</p></div>
<div class="card">
  <div class="status" id="who">Checking staff session…</div>
  <h2 style="margin-top:16px">Staff Modules</h2>
  <div class="hub" id="menu">
    <a class="btn primary" data-role="REGISTRATION,ADMIN" href="./master.html?v=39">REGISTRATION</a>
    <a class="btn blue" data-role="CHECKIN,ADMIN" href="./checkin.html?v=40">CHECK-IN</a>
    <a class="btn blue" data-role="SNACK,ADMIN" href="./snack.html?v=26">SNACK</a>
    <a class="btn blue" data-role="LUNCH,ADMIN" href="./lunch.html?v=26">LUNCH</a>
    <a class="btn blue" data-role="RAFFLE,ADMIN" href="./raffle.html?v=26">RAFFLE</a>
    <a class="btn gold" data-new-feature="reports-upgrade" data-role="REGISTRATION,ADMIN" href="./reports.html?v=34">REPORTS</a>
    <a class="btn primary" data-new-feature="biometric-file-tools" data-role="REGISTRATION,ADMIN" href="./index.html?v=26">BIOMETRIC / ADD FILE</a>
    <a class="btn gold" data-new-feature="names-quickshare-menu-v36" data-role="REGISTRATION,CHECKIN,SNACK,LUNCH,RAFFLE,ADMIN" href="./staff-names-share.html?v=40">NAMES QUICK SHARE</a>
  </div>
  <button class="ghost" id="logout">LOG OUT</button>
</div>
<div class="footer">Registration Committee</div>
</div>
<script>
const ok=sessionStorage.getItem('pdwStaffSession')==='1';
if(!ok){location.replace('./login.html?v=40')}
const role=sessionStorage.getItem('pdwStaffRole')||'';
const name=sessionStorage.getItem('pdwStaffName')||'Staff';
document.querySelector('#who').textContent=name+' • '+role;
document.querySelectorAll('[data-role]').forEach(el=>{
  const allowed=el.dataset.role.split(',');
  if(!allowed.includes(role))el.style.display='none';
});
document.querySelector('#logout').onclick=()=>{
  ['pdwStaffSession','pdwStaffRole','pdwStaffName','pdwStaffLoginAt'].forEach(k=>sessionStorage.removeItem(k));
  location.replace('./login.html?v=40');
};
</script><script src="./feature-highlights.js?v=40"></script></body></html>
