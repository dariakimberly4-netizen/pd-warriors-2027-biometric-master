<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f6342">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDW 2027">
<link rel="manifest" href="./manifest.webmanifest?v=63">
<title>PD Warriors 2027 — Biometric Verification</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fffaf0;color:#10231b;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.page{width:100%;min-height:100vh;padding:16px 14px 34px}
.hero{width:100%;background:#0f6342;color:#fff;border-radius:24px;padding:36px 18px;text-align:center;box-shadow:0 10px 26px rgba(20,40,30,.11)}
.hero h1{margin:0;font-size:clamp(38px,10vw,56px);line-height:1.03;font-weight:900}
.hero p{margin:12px 0 0;font-size:clamp(24px,6.2vw,32px);line-height:1.2;font-weight:800}
.back{display:flex;align-items:center;min-height:62px;padding:0 6px;color:#0f6342;text-decoration:none;font-size:clamp(21px,5.5vw,27px);font-weight:900}
.card{width:100%;background:#fff;border:1px solid #e7dfd3;border-radius:24px;padding:32px 22px 34px;box-shadow:0 10px 28px rgba(20,40,30,.09)}
.card h2{margin:0 0 26px;color:#0f6342;font-size:clamp(34px,8.7vw,46px);line-height:1.08;font-weight:900}
.who{width:100%;background:#fff7e9;border:2px solid #efd9ad;border-radius:20px;padding:24px 20px;font-size:clamp(23px,6vw,31px);line-height:1.3;font-weight:900}
.action{display:flex;width:100%;min-height:100px;margin-top:22px;border:2px solid #ded3bb;border-radius:20px;padding:20px 18px;align-items:center;justify-content:center;text-align:center;background:#faf7ee;color:#0f6342;font:900 clamp(22px,5.8vw,30px)/1.2 Arial,Helvetica,sans-serif;cursor:pointer}
.privacy{margin:28px 4px 0;color:#68716d;font-size:clamp(20px,5.2vw,26px);line-height:1.55;font-weight:700}
.footer{text-align:center;color:#68716d;font-size:clamp(19px,4.8vw,24px);font-weight:800;padding:28px 8px 12px}
@media(min-width:720px){
 .page{max-width:900px;margin:auto;padding:28px}
 .hero{padding:44px 24px}
 .card{padding:42px 34px}
}
</style>
</head>
<body>
<main class="page">
<header class="hero"><h1>PD Warriors 2027</h1><p>Biometric Verification</p></header>
<a class="back" href="./index.html?v=65">← Back to Search</a>
<section class="card">
<h2>Verify on Your Own Phone</h2>
<div id="who" class="who">Loading participant…</div>
<button id="fallback" class="action">STAFF-ASSISTED GENERATE QR CODE</button>
<p class="privacy">Your fingerprint or face stays on your own device. The event system does not store fingerprint images, face images, or biometric templates.</p>
</section>
<div class="footer">Step 2 of 3 • Biometric Verification</div>
</main>
<script src="./app-core.js?v=65"></script>
<script>
const p=PDW.active();
if(!p){location.replace('./index.html?v=65')}
else document.getElementById('who').textContent=p.name+' — '+(p.type==='PATIENT'?'PD Warrior':'Companion');

document.getElementById('fallback').onclick=()=>{
 const p=PDW.active();
 PDW.updatePerson(p.id,x=>{x.biometric=false;x.verifyMethod='STAFF_ASSISTED';x.biometricVerifiedAt=null});
 location.href='./pass-large-v65.html?v=65';
};

if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
