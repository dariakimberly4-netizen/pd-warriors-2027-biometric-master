<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./app.css"><title>PD Warriors 2027 — Master Database</title></head><body><div class="app"><div class="hero"><h1>Registration</h1><p>Master Database</p></div><a class="toplink" href="./admin.html">← Admin Menu</a><div class="card"><div class="kpi"><div><b id="reg">0</b>Registered</div><div><b id="arr">0</b>Arrived</div><div><b id="pat">0</b>Patients</div><div><b id="com">0</b>Companions</div></div><button class="primary" id="sync">SEND DATABASE TO STAFF</button><div id="syncmsg" class="status warn" style="margin-top:12px">No sync performed yet.</div></div><div class="card"><h2>Attendee Database</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Bio</th><th>Arrived</th><th>Snack</th><th>Lunch</th><th>Raffle</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="./app-core.js"></script><script>function render(){const d=PDW.db(),pat=d.people.filter(x=>x.type==='PATIENT').length;document.querySelector('#reg').textContent=d.people.length;document.querySelector('#arr').textContent=d.people.filter(x=>x.arrived).length;document.querySelector('#pat').textContent=pat;document.querySelector('#com').textContent=d.people.length-pat;document.querySelector('#rows').innerHTML=d.people.map(p=>'<tr><td><b>'+p.id+'</b></td><td>'+p.name+'</td><td>'+p.type+'</td><td>'+(p.biometric?'✓':'—')+'</td><td>'+(p.arrived?'✓':'—')+'</td><td>'+(p.snack?'✓':'—')+'</td><td>'+(p.lunch?'✓':'—')+'</td><td>'+(p.type==='COMPANION'?'NOT ELIGIBLE':p.raffle?'✓':'—')+'</td></tr>').join('')||'<tr><td colspan="8">No participants yet.</td></tr>'}render();document.querySelector('#sync').onclick=()=>{const d=PDW.db();d.pending=0;d.syncedAt=new Date().toLocaleTimeString();PDW.save(d);document.querySelector('#syncmsg').className='status';document.querySelector('#syncmsg').textContent='Database sent to staff copies at '+d.syncedAt};</script></body></html>
