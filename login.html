<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./app.css?v=29">
<title>PD Warriors 2027 — Staff Login</title>
<style>
.staff-login-highlight{
  position:relative;
  border:3px solid #c6a15b !important;
  box-shadow:0 0 0 6px rgba(198,161,91,.16),0 10px 26px rgba(20,35,28,.09) !important;
}
.staff-login-highlight::before{
  content:"NEW FEATURE";
  position:absolute;
  top:-13px;
  right:18px;
  z-index:30;
  background:#c6a15b;
  color:#17221c;
  border:2px solid #fffaf0;
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.05em;
}
.staff-login-highlight .staffLogin{
  box-shadow:0 0 0 3px rgba(198,161,91,.28);
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>PD Warriors 2027</h1>
    <p>Staff Login</p>
  </div>

  <div class="card" id="staffLoginCard">
    <h2>Select Staff Role</h2>
    <p class="small">Demo one-tap login. Each role opens only the station assigned to it.</p>

    <div class="hub">
      <button class="primary staffLogin" data-name="Registration Staff" data-role="REGISTRATION" data-go="./master.html?v=29">REGISTRATION</button>
      <button class="blue staffLogin" data-name="Check-In Staff" data-role="CHECKIN" data-go="./checkin.html?v=29">CHECK-IN</button>
      <button class="blue staffLogin" data-name="Snack Staff" data-role="SNACK" data-go="./snack.html?v=29">SNACK</button>
      <button class="blue staffLogin" data-name="Lunch Staff" data-role="LUNCH" data-go="./lunch.html?v=29">LUNCH</button>
      <button class="blue staffLogin" data-name="Raffle Staff" data-role="RAFFLE" data-go="./raffle.html?v=29">RAFFLE</button>
      <button class="gold staffLogin" data-name="Administrator" data-role="ADMIN" data-go="./admin.html?v=29">ADMIN</button>
    </div>

    <div class="status warn" style="margin-top:14px">
      This is a demo login for GitHub Pages. It is not a production password/security system.
    </div>
  </div>

  <div class="footer">Registration Committee • Staff Access</div>
</div>

<script>
const STAFF_LOGIN_HIGHLIGHT_KEY='pdw2027SeenStaffLoginV29';
const staffLoginCard=document.querySelector('#staffLoginCard');

if(localStorage.getItem(STAFF_LOGIN_HIGHLIGHT_KEY)!=='1'){
  staffLoginCard.classList.add('staff-login-highlight');
}

document.querySelectorAll('.staffLogin').forEach(btn=>{
  btn.addEventListener('click',()=>{
    localStorage.setItem(STAFF_LOGIN_HIGHLIGHT_KEY,'1');
    staffLoginCard.classList.remove('staff-login-highlight');

    sessionStorage.setItem('pdwStaffSession','1');
    sessionStorage.setItem('pdwStaffRole',btn.dataset.role);
    sessionStorage.setItem('pdwStaffName',btn.dataset.name);
    sessionStorage.setItem('pdwStaffLoginAt',new Date().toISOString());
    location.href=btn.dataset.go;
  });
});
</script>
</body>
</html>
