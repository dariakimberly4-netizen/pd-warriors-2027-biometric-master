<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css?v=51">
<title>PD Warriors 2027 — Raffle Draw</title>
<style>
.raffle-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.raffle-kpi>div{background:#f6f2e8;border-radius:16px;padding:14px;text-align:center}
.raffle-kpi b{display:block;font-size:26px;color:#0f5132}
.draw-stage{margin-top:14px;border:2px solid #e2d7c4;border-radius:22px;padding:24px 16px;background:#fffdf8;text-align:center}
.draw-stage .eyebrow{font-size:13px;font-weight:1000;letter-spacing:.08em;color:#6d644f}
.draw-name{font-size:34px;line-height:1.08;font-weight:1000;color:#0f5132;margin:12px 0}
.draw-sub{font-weight:800;color:#657066}
.winner-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid #ece5d8}
.winner-row:last-child{border-bottom:0}
.winner-row b{color:#0f5132}
.winner-no{flex:0 0 auto;border-radius:999px;padding:6px 9px;background:#f3ead7;font-weight:1000}
@media(max-width:560px){
  .raffle-kpi{grid-template-columns:1fr}
  .draw-name{font-size:28px}
}
</style>
</head>
<body>
<script>
(function(){
  const ok=sessionStorage.getItem('pdwStaffSession')==='1';
  const r=sessionStorage.getItem('pdwStaffRole')||'';
  if(!ok||!(r==='ADMIN'||r==='RAFFLE'))location.replace('./login.html?v=51');
})();
</script>

<div class="app">
  <div class="hero">
    <h1>Raffle Draw</h1>
    <p>PD Warriors 2027</p>
  </div>

  <a class="toplink" href="./admin.html?v=51">← Staff Menu</a>

  <div class="card">
    <div class="station">RAFFLE DRAW</div>

    <div class="status">
      <b>PATIENTS / PD WARRIORS ONLY</b><br>
      Companions are automatically excluded from the draw.
    </div>

    <div class="raffle-kpi">
      <div><b id="eligibleCount">0</b>Eligible Patients</div>
      <div><b id="remainingCount">0</b>Remaining</div>
      <div><b id="winnerCount">0</b>Winners</div>
    </div>

    <div class="draw-stage">
      <div class="eyebrow">CURRENT DRAW</div>
      <div class="draw-name" id="drawName">READY</div>
      <div class="draw-sub" id="drawSub">Tap DRAW WINNER to begin.</div>
    </div>

    <button class="primary" id="drawBtn">DRAW WINNER</button>
    <div id="drawMessage" class="status hidden" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>Winner History</h2>
    <div id="winnerHistory"></div>
  </div>
</div>

<script src="./app-core.js?v=51"></script>
<script src="./raffle-draw-v51.js"></script>
</body>
</html>
