<body>
<div class="app">
  <div class="hero">
    <h1>PD Warriors 2027</h1>
    <p>Biometric Verification</p>
  </div>

  <a class="toplink" href="./index.html?v=58">← Back to Search</a>

  <div class="card">
    <h2>Verify on Your Own Phone</h2>
    <div id="who" class="status warn">Loading participant…</div>

    <button class="blue" id="bio">VERIFY &amp; GENERATE QR CODE</button>
    <button class="ghost" id="fallback">STAFF-ASSISTED VERIFICATION &amp; GENERATE QR</button>

    <p class="small">
      Your fingerprint or face stays on your own device. The event system does not store fingerprint images,
      face images, or biometric templates.
    </p>
  </div>

  <div class="footer">Step 2 of 3 • Verify &amp; Generate QR Code</div>
</div>

<script src="./app-core.js?v=58"></script>
<script>
const p=PDW.active();
if(!p){
  location.href='./index.html?v=58';
}else{
  document.querySelector('#who').textContent=p.name+' — '+(p.type==='PATIENT'?'PD Warrior':'Companion');
}

document.querySelector('#bio').onclick=async()=>{
  const p=PDW.active();
  try{
    if(!window.PublicKeyCredential||!navigator.credentials)throw 0;
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const userId=crypto.getRandomValues(new Uint8Array(16));
    await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{name:'PD Warriors 2027'},
        user:{id:userId,name:p.id,displayName:p.name},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{userVerification:'required'},
        timeout:60000,
        attestation:'none'
      }
    });
    PDW.updatePerson(p.id,x=>{
      x.biometric=true;
      x.verifyMethod='DEVICE_BIOMETRIC';
      x.biometricVerifiedAt=new Date().toISOString();
    });
    location.href='./pass.html?v=58';
  }catch(e){
    alert('Biometric was unavailable or cancelled. Please try again or use staff-assisted verification.');
  }
};

document.querySelector('#fallback').onclick=()=>{
  const p=PDW.active();
  PDW.updatePerson(p.id,x=>{
    x.biometric=false;
    x.verifyMethod='STAFF_ASSISTED';
    x.biometricVerifiedAt=null;
  });
  location.href='./pass.html?v=58';
};
</script>
</body>
