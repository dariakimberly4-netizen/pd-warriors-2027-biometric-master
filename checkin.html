<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./app.css"><title>PD Warriors 2027 — Check-In</title></head><body><div class="app"><div class="hero"><h1>Check-In</h1><p>Arrival Verification</p></div><a class="toplink" href="./admin.html">← Admin Menu</a><div class="card"><div class="station">CHECK-IN</div><label>Scan / Enter Participant ID</label><input id="id" placeholder="PDW-0001 or COM-0001"><button class="blue" id="find">FIND PARTICIPANT</button><div id="result" class="status warn" style="margin-top:12px">No participant selected.</div><button class="primary" id="action" disabled>CONFIRM ARRIVAL</button></div><div class="card"><h2>Recent Check-In Transactions</h2><div class="tablewrap"><table><thead><tr><th>Time</th><th>ID</th><th>Action</th></tr></thead><tbody id="tx"></tbody></table></div></div></div><script src="./app-core.js"></script><script>let selected='';const KIND='ARRIVAL',STATION='CHECK-IN-01';function renderTx(){const d=PDW.db();document.querySelector('#tx').innerHTML=d.tx.filter(t=>t.station===STATION).slice().reverse().slice(0,20).map(t=>'<tr><td>'+t.time+'</td><td>'+t.id+'</td><td>'+t.action+'</td></tr>').join('')||'<tr><td colspan="3">No transactions yet.</td></tr>'}renderTx();document.querySelector('#find').onclick=()=>{const id=document.querySelector('#id').value.trim().toUpperCase(),p=PDW.person(id),r=document.querySelector('#result'),a=document.querySelector('#action');selected=p?p.id:'';if(!p){r.className='status bad';r.textContent='Participant not found';a.disabled=true;return}let msg=p.name+' — '+(p.type==='PATIENT'?'PD Warrior':'Companion');if(KIND==='RAFFLE'&&p.type==='COMPANION'){msg+=' — NOT ELIGIBLE FOR RAFFLE';r.className='status bad';a.disabled=true}else{r.className='status';r.textContent=msg;a.disabled=false}r.textContent=msg};document.querySelector('#action').onclick=()=>{if(!selected)return;const out=PDW.process(selected,KIND,STATION),r=document.querySelector('#result');r.className=out.ok?'status':'status bad';r.textContent=out.msg;renderTx();document.querySelector('#action').disabled=!out.ok};</script></body></html>
