<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><title>PD Warriors 2027 — Registration</title></head><body class="registration-page"><div class="app"><div class="hero"><h1>PD Warriors 2027</h1><p>Home Registration</p></div><div class="card"><h2>Participant Registration</h2><label>Full Name</label><input id="name" autocomplete="name" placeholder="Enter your full name"><label>Participant Type</label><select id="type"><option value="PATIENT">Patient / PD Warrior</option><option value="COMPANION">Companion</option></select><button class="primary" id="go">REGISTER & CONTINUE</button><p class="small">Patient: Snack + Lunch + Raffle. Companion: Snack + Lunch only.</p></div><div class="footer">Step 1 of 3 • Registration only</div></div><script src="./app-core.js"></script><script>document.querySelector('#go').onclick=()=>{const n=document.querySelector('#name').value.trim();if(!n)return alert('Please enter your full name.');PDW.register(n,document.querySelector('#type').value);location.href='./biometric.html'};</script></body></html>
