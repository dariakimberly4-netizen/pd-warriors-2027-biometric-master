<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./app.css">
<title>PD Warriors 2027 — Lunch</title>
<style>
.scanner-box{margin-top:14px;border:2px solid #d8d0c0;border-radius:20px;padding:12px;background:#fffdf8}
.scanner-box video{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:16px;background:#111}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-actions button{margin-top:10px}
.hidden{display:none!important}
@media(max-width:560px){.scan-actions{grid-template-columns:1fr}}
</style>
</head>
<body data-kind="LUNCH" data-station="LUNCH-01"><script>(function(){const ok=sessionStorage.getItem('pdwStaffSession')==='1';const r=sessionStorage.getItem('pdwStaffRole')||'';if(!ok||!(r==='ADMIN'||r==='LUNCH'))location.replace('./login.html?v=32');})();</script>
<div class="app">
  <div class="hero">
    <h1>Lunch</h1>
    <p>Lunch Claim Station</p>
  </div>

  <a class="toplink" href="./admin.html">← Admin Menu</a>

  <div class="card">
    <div class="station">LUNCH</div>

    <button class="blue" id="startScan">SCAN QR WITH CAMERA</button>

    <div id="cameraBox" class="scanner-box hidden">
      <video id="scannerVideo" playsinline muted></video>
      <canvas id="scannerCanvas" class="hidden"></canvas>
      <button class="ghost" id="stopScan" disabled>STOP CAMERA</button>
    </div>

    <label>Participant ID / QR Payload</label>
    <input id="id" placeholder="Scan QR or enter Participant ID">

    <button class="ghost" id="find">FIND PARTICIPANT</button>

    <div id="result" class="status warn" style="margin-top:12px">
      No participant selected.
    </div>

    <button class="primary" id="action" disabled>RELEASE LUNCH</button>
  </div>

  <div class="card">
    <h2>Recent Lunch Transactions</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Time</th><th>ID</th><th>Action</th></tr></thead>
        <tbody id="tx"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="./app-core.js?v=32"></script>
<script src="./vendor/jsQR.js?v=32"></script>
<script src="./station-scanner.js?v=32"></script>
</body>
</html>
